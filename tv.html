<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Luna TV - Photo Slideshow</title>
    <style>
        :root {
            --theme-accent: #e50914;
        }

        body, html {
            margin: 0; padding: 0; width: 100%; height: 100%; background-color: #000000; overflow: hidden; font-family: 'Segoe UI', Arial, sans-serif;
        }
        .slideshow-container {
            width: 100%; height: 100%; display: flex; justify-content: center; align-items: center; position: relative;
        }
        
        .slide {
            position: absolute; max-width: 100%; max-height: 100%; width: auto; height: auto; top: 50%; left: 50%; transform: translate(-50%, -50%); opacity: 0; transition: opacity 1s ease-in-out;
        }
        .slide.active { opacity: 1; }

        /* NEW Floating Live Vote Badge Overlays */
        .vote-badge {
            position: absolute;
            top: 40px;
            right: 40px;
            background: rgba(0, 0, 0, 0.75);
            border: 2px solid var(--theme-accent);
            color: #ffffff;
            padding: 12px 24px;
            border-radius: 50px;
            font-size: 36px;
            font-weight: bold;
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
            z-index: 999;
            opacity: 0;
            transition: opacity 1s ease-in-out, border-color 0.5s ease;
            display: flex;
            align-items: center;
            gap: 12px;
        }
        .vote-badge.active { opacity: 1; }
        .vote-badge span { color: var(--theme-accent); transition: color 0.5s ease; }

        .welcome-screen { position: absolute; color: white; text-align: center; z-index: 10; }
        .welcome-screen h1 { font-size: 64px; margin-bottom: 10px; color: var(--theme-accent); text-shadow: 0 4px 10px rgba(0,0,0,0.8); transition: color 0.5s ease; }
        .welcome-screen p { font-size: 28px; color: #aaa; margin: 0; }

        .marquee-container {
            position: fixed; bottom: 0; left: 0; width: 100%; background: rgba(0, 0, 0, 0.85); border-top: 3px solid var(--theme-accent); color: #ffffff; padding: 15px 0; font-size: 32px; font-weight: bold; overflow: hidden; white-space: nowrap; box-sizing: border-box; z-index: 99999; display: none; transition: border-color 0.5s ease;
        }
        .marquee-text { display: inline-block; padding-left: 100%; animation: scroll-marquee 25s linear infinite; }
        @keyframes scroll-marquee { 0% { transform: translate3d(0, 0, 0); } 100% { transform: translate3d(-100%, 0, 0); } }
    </style>

    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>
</head>
<body>

    <div class="slideshow-container" id="slideshow">
        <div class="welcome-screen" id="welcome-msg">
            <h1>Caffe Bar Luna</h1>
            <p>Scan the QR code to post your photos here! 📸</p>
        </div>
        
        <img id="display-img-1" class="slide" src="data:image/gif;base64,R0lGODlhAQABAIAAAAAAAP///yH5BAEAAAAALAAAAAABAAEAAAIBRAA7" alt="">
        <div id="vote-badge-1" class="vote-badge"><span>❤️</span><span id="vote-text-1">0</span></div>
        
        <img id="display-img-2" class="slide" src="data:image/gif;base64,R0lGODlhAQABAIAAAAAAAP///yH5BAEAAAAALAAAAAABAAEAAAIBRAA7" alt="">
        <div id="vote-badge-2" class="vote-badge"><span>❤️</span><span id="vote-text-2">0</span></div>
    </div>

    <div class="marquee-container" id="ticker-bar">
        <span class="marquee-text" id="ticker-text"></span>
    </div>

    <script>
        // === PASTE YOUR SAME FIREBASE CONFIG OBJECT HERE ===
        const firebaseConfig = {
            apiKey: "AIzaSyACxw49eWeaIy-9Dieu0yaV28F7XdgG1hE",
  authDomain: "lunaphotowall.firebaseapp.com",
  projectId: "lunaphotowall",
  storageBucket: "lunaphotowall.firebasestorage.app",
  messagingSenderId: "890645449459",
  appId: "1:890645449459:web:040fceaec5c2a9f6f60586",
  measurementId: "G-53RH94EDMY"
        };
        // ===================================================

        firebase.initializeApp(firebaseConfig);
        const db = firebase.firestore();

        let photosArray = [];
        let currentIndex = 0;
        let slideshowInterval = null;
        let activeToggle = 1;
        let currentSpeed = 5000;
        const transparentPixel = "data:image/gif;base64,R0lGODlhAQABAIAAAAAAAP///yH5BAEAAAAALAAAAAABAAEAAAIBRAA7";

        const themePalette = {
            'black-red': '#e50914', 'black-gold': '#d4af37', 'electric-cyber': '#00f0ff', 'pub-emerald': '#00a86b', 'sunset-lounge': '#ff5722'
        };

        // Listen for Approved Photos
        db.collection('photos')
          .where('status', '==', 'approved')
          .onSnapshot((snapshot) => {
              let docsArray = [];
              snapshot.forEach(doc => { docsArray.push(doc.data()); });

              docsArray.sort((a, b) => {
                  const timeA = a.timestamp ? a.timestamp.seconds : 0;
                  const timeB = b.timestamp ? b.timestamp.seconds : 0;
                  return timeB - timeA;
              });

              // Process both url and live like metrics in structural objects
              photosArray = docsArray.map(item => ({ url: item.url, likes: item.likes || 0 }));
              handleSlideshowUpdate();
          });

        // Live settings observer
        db.collection('settings').doc('admin').onSnapshot((doc) => {
            if (doc.exists) {
                const data = doc.data();
                if (data.colorTheme && themePalette[data.colorTheme]) {
                    document.documentElement.style.setProperty('--theme-accent', themePalette[data.colorTheme]);
                }
                if (data.slideshowSpeed) {
                    const newSpeed = data.slideshowSpeed * 1000;
                    if (newSpeed !== currentSpeed) {
                        currentSpeed = newSpeed;
                        if (slideshowInterval) { clearInterval(slideshowInterval); slideshowInterval = setInterval(runRotation, currentSpeed); }
                    }
                }
                const tickerBar = document.getElementById('ticker-bar');
                const tickerText = document.getElementById('ticker-text');
                if (data.tickerText && data.tickerText.trim() !== "") {
                    tickerText.textContent = data.tickerText; tickerBar.style.display = 'block';
                } else { tickerBar.style.display = 'none'; }
            }
        });

        function handleSlideshowUpdate() {
            if (photosArray.length === 0) {
                document.getElementById('welcome-msg').style.display = 'block';
                document.getElementById('display-img-1').src = transparentPixel;
                document.getElementById('display-img-2').src = transparentPixel;
                document.getElementById('display-img-1').classList.remove('active');
                document.getElementById('display-img-2').classList.remove('active');
                document.getElementById('vote-badge-1').classList.remove('active');
                document.getElementById('vote-badge-2').classList.remove('active');
                clearInterval(slideshowInterval);
                slideshowInterval = null;
                return;
            }

            document.getElementById('welcome-msg').style.display = 'none';

            // Real-time live check: If an image is currently playing on screen, update its vote count live
            if (slideshowInterval && photosArray[currentIndex]) {
                document.getElementById('vote-text-' + activeToggle).textContent = photosArray[currentIndex].likes;
            }

            if (!slideshowInterval) {
                const activeImg = document.getElementById('display-img-' + activeToggle);
                const activeBadge = document.getElementById('vote-badge-' + activeToggle);
                const activeText = document.getElementById('vote-text-' + activeToggle);
                
                activeImg.src = photosArray[0].url;
                activeText.textContent = photosArray[0].likes;
                activeImg.classList.add('active');
                activeBadge.classList.add('active');
                
                currentIndex = 0;
                slideshowInterval = setInterval(runRotation, currentSpeed);
            }
        }

        function runRotation() {
            if (photosArray.length <= 1) return;

            currentIndex = (currentIndex + 1) % photosArray.length;
            const nextData = photosArray[currentIndex];

            const currentImg = document.getElementById('display-img-' + activeToggle);
            const currentBadge = document.getElementById('vote-badge-' + activeToggle);
            
            activeToggle = activeToggle === 1 ? 2 : 1;
            
            const nextImg = document.getElementById('display-img-' + activeToggle);
            const nextBadge = document.getElementById('vote-badge-' + activeToggle);
            const nextText = document.getElementById('vote-text-' + activeToggle);

            nextImg.src = nextData.url;
            nextText.textContent = nextData.likes;
            
            nextImg.classList.add('active');
            nextBadge.classList.add('active');
            currentImg.classList.remove('active');
            currentBadge.classList.remove('active');
        }
    </script>
</body>
</html>
