<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Luna TV - Photo Slideshow</title>
    <style>
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background-color: #000000;
            overflow: hidden;
            font-family: 'Segoe UI', Arial, sans-serif;
        }
        .slideshow-container {
            width: 100%;
            height: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
            position: relative;
        }
        
    
        .slide.active { opacity: 1; }

        .welcome-screen {
            position: absolute;
            color: white;
            text-align: center;
            z-index: 10;
        }
        .welcome-screen h1 { font-size: 64px; margin-bottom: 10px; color: #e50914; text-shadow: 0 4px 10px rgba(0,0,0,0.8); }
        .welcome-screen p { font-size: 28px; color: #aaa; margin: 0; }

        /* Smooth Scrolling Marquee Ticker */
        .marquee-container {
            position: fixed;
            bottom: 0;
            left: 0;
            width: 100%;
            background: rgba(0, 0, 0, 0.85);
            border-top: 3px solid #e50914;
            color: #ffffff;
            padding: 15px 0;
            font-size: 32px;
            font-weight: bold;
            overflow: hidden;
            white-space: nowrap;
            box-sizing: border-box;
            z-index: 99999;
            display: none;
        }
        .marquee-text {
            display: inline-block;
            padding-left: 100%;
            animation: scroll-marquee 25s linear infinite;
        }
        @keyframes scroll-marquee {
            0% { transform: translate3d(0, 0, 0); }
            100% { transform: translate3d(-100%, 0, 0); }
        }
    </style>

    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>
</head>
<body>

    <div class="slideshow-container" id="slideshow">
        <div class="welcome-screen" id="welcome-msg">
            <h1>Caffe Bar Luna</h1>
            <p>Scan the QR code to post your photos here! 📸</p>
        </div>
        <img id="display-img-1" class="slide" src="" alt="Slideshow image 1">
        <img id="display-img-2" class="slide" src="" alt="Slideshow image 2">
    </div>

    <div class="marquee-container" id="ticker-bar">
        <span class="marquee-text" id="ticker-text"></span>
    </div>

    <script>
        // === PASTE YOUR SAME FIREBASE CONFIG OBJECT HERE ===
        const firebaseConfig = {
            apiKey: "AIzaSyACxw49eWeaIy-9Dieu0yaV28F7XdgG1hE",
  authDomain: "lunaphotowall.firebaseapp.com",
  projectId: "lunaphotowall",
  storageBucket: "lunaphotowall.firebasestorage.app",
  messagingSenderId: "890645449459",
  appId: "1:890645449459:web:040fceaec5c2a9f6f60586",
  measurementId: "G-53RH94EDMY"
        };
        // ===================================================

        firebase.initializeApp(firebaseConfig);
        const db = firebase.firestore();

        let photosArray = [];
        let currentIndex = 0;
        let slideshowInterval = null;
        let activeToggle = 1;

        // Listen for Approved Photos
        db.collection('photos')
          .where('status', '==', 'approved')
          .onSnapshot((snapshot) => {
              let docsArray = [];
              snapshot.forEach(doc => { docsArray.push(doc.data()); });

              docsArray.sort((a, b) => {
                  const timeA = a.timestamp ? a.timestamp.seconds : 0;
                  const timeB = b.timestamp ? b.timestamp.seconds : 0;
                  return timeB - timeA;
              });

              photosArray = docsArray.map(item => item.url);
              handleSlideshowUpdate();
          });

        // Live settings observer (Promo Text Only)
        db.collection('settings').doc('admin').onSnapshot((doc) => {
            if (doc.exists) {
                const data = doc.data();
                const tickerBar = document.getElementById('ticker-bar');
                const tickerText = document.getElementById('ticker-text');
                if (data.tickerText && data.tickerText.trim() !== "") {
                    tickerText.textContent = data.tickerText;
                    tickerBar.style.display = 'block';
                } else {
                    tickerBar.style.display = 'none';
                }
            }
        });

        function handleSlideshowUpdate() {
            if (photosArray.length === 0) {
                document.getElementById('welcome-msg').style.display = 'block';
                document.getElementById('display-img-1').classList.remove('active');
                document.getElementById('display-img-2').classList.remove('active');
                clearInterval(slideshowInterval);
                slideshowInterval = null;
                return;
            }

            document.getElementById('welcome-msg').style.display = 'none';

            if (!slideshowInterval) {
                const activeImg = document.getElementById('display-img-' + activeToggle);
                activeImg.src = photosArray[0];
                activeImg.classList.add('active');
                
                currentIndex = 0;
                slideshowInterval = setInterval(runRotation, 5000);
            }
        }

        function runRotation() {
            if (photosArray.length <= 1) return;

            currentIndex = (currentIndex + 1) % photosArray.length;
            const nextImageSrc = photosArray[currentIndex];

            const currentImg = document.getElementById('display-img-' + activeToggle);
            activeToggle = activeToggle === 1 ? 2 : 1;
            const nextImg = document.getElementById('display-img-' + activeToggle);

            nextImg.src = nextImageSrc;
            nextImg.classList.add('active');
            currentImg.classList.remove('active');
        }
    </script>
</body>
</html>
