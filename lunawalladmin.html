<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Luna - Control Dashboard</title>
    <style>
        body {
            font-family: 'Segoe UI', Arial, sans-serif;
            background-color: #121212;
            color: #ffffff;
            margin: 0;
            padding: 20px;
        }
        .container {
            max-width: 600px;
            margin: 0 auto;
            background: #1e1e1e;
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
            border-top: 4px solid #e50914;
        }
        h1 { text-align: center; color: #e50914; margin-bottom: 25px; }
        
        .controls-card {
            background: #2a2a2a;
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 20px;
            display: flex;
            flex-direction: column;
            gap: 15px;
        }
        .row {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .label-text { font-size: 16px; font-weight: bold; }
        
        .ticker-input-group {
            display: flex;
            gap: 10px;
            margin-top: 5px;
        }
        input[type="text"] {
            flex: 1;
            padding: 10px;
            border-radius: 6px;
            border: 1px solid #444;
            background: #121212;
            color: white;
            font-size: 14px;
        }
        
        select {
            padding: 8px 12px;
            border-radius: 6px;
            background: #121212;
            color: white;
            border: 1px solid #444;
            font-size: 14px;
            font-weight: bold;
            cursor: pointer;
        }

        .switch {
            position: relative;
            display: inline-block;
            width: 50px;
            height: 26px;
        }
        .switch input { opacity: 0; width: 0; height: 0; }
        .slider {
            position: absolute; cursor: pointer; top: 0; left: 0; right: 0; bottom: 0;
            background-color: #ccc; transition: .4s; border-radius: 34px;
        }
        .slider:before {
            position: absolute; content: ""; height: 18px; width: 18px; left: 4px; bottom: 4px;
            background-color: white; transition: .4s; border-radius: 50%;
        }
        input:checked + .slider { background-color: #4caf50; }
        input:checked + .slider:before { transform: translateX(24px); }

        .btn-action { padding: 10px 15px; border: none; font-weight: bold; border-radius: 6px; cursor: pointer; }
        .btn-approve { background: #4caf50; color: white; }
        .btn-reject { background: #e50914; color: white; }
        
        .btn-nuke {
            background-color: #e50914; color: white; border: none; padding: 12px;
            font-size: 16px; font-weight: bold; border-radius: 6px; cursor: pointer; width: 100%;
        }
        .btn-nuke:hover { background-color: #b20710; }

        .btn-archive-toggle {
            background-color: #333333; color: white; border: 1px solid #444; padding: 12px;
            font-size: 16px; font-weight: bold; border-radius: 6px; cursor: pointer; width: 100%;
            margin-top: 15px; display: block; text-align: center;
        }
        .btn-archive-toggle:hover { background-color: #444; }
        
        /* Updated Archive Grid Button Layouts */
        .btn-download { background: #007bff; color: white; flex: 1; }
        .btn-delete-permanent { background: #3d0c0f; color: #ff4a5a; border: 1px solid #e50914; flex: 1; }
        .btn-delete-permanent:hover { background: #e50914; color: white; }

        .queue-title { border-bottom: 2px solid #333; padding-bottom: 8px; margin-top: 25px; }
        .photo-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; margin-top: 15px; }
        .photo-card { background: #2a2a2a; padding: 10px; border-radius: 8px; text-align: center; }
        .photo-card img { max-width: 100%; height: 150px; object-fit: cover; border-radius: 6px; }
        .action-btns { display: flex; gap: 10px; margin-top: 10px; }
    </style>

    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>
</head>
<body>

    <div class="container">
        <h1>Luna Dashboard</h1>

        <div class="controls-card">
            <div class="row">
                <span class="label-text">Guest Photo Moderation</span>
                <label class="switch">
                    <input type="checkbox" id="mod-toggle" onchange="toggleModeration(this.checked)">
                    <span class="slider"></span>
                </label>
            </div>

            <div class="row">
                <span class="label-text">Weekend Podium Takeover</span>
                <label class="switch">
                    <input type="checkbox" id="leaderboard-toggle" onchange="toggleLeaderboard(this.checked)">
                    <span class="slider"></span>
                </label>
            </div>
            
            <div class="row">
                <span class="label-text">Slideshow Rotation Speed</span>
                <select id="speed-select" onchange="updateSpeed(this.value)">
                    <option value="3">⚡ Fast (3s)</option>
                    <option value="5">▶ Normal (5s)</option>
                    <option value="10">🐢 Slow (10s)</option>
                    <option value="15">⏳ Relaxed (15s)</option>
                </select>
            </div>

            <div class="row">
                <span class="label-text">TV Color Theme Profile</span>
                <select id="theme-select" onchange="updateTheme(this.value)">
                    <option value="black-red">🔴 Black & Red</option>
                    <option value="black-gold">🟡 Black & Gold</option>
                    <option value="electric-cyber">🔵 Electric Cyber (Blue)</option>
                    <option value="pub-emerald">🟢 Pub Quiz Emerald</option>
                    <option value="sunset-lounge">🟠 Sunset Lounge (Orange)</option>
                </select>
            </div>
            
            <hr style="border: 0; border-top: 1px solid #444; margin: 5px 0;">
            
            <div style="display: flex; flex-direction: column; gap: 5px;">
                <span class="label-text">Bottom Promo Ticker Text</span>
                <div class="ticker-input-group">
                    <input type="text" id="ticker-input" placeholder="Ex: Next Pub Quiz on Tuesday at 8 PM! 🏆">
                    <button class="btn-action btn-approve" onclick="updateTicker()">Save</button>
                </div>
            </div>

            <hr style="border: 0; border-top: 1px solid #444; margin: 5px 0;">
            <button class="btn-nuke" onclick="nukeScreen()">💥 NUKE CURRENT TV SLIDESHOW</button>
        </div>

        <h3 class="queue-title">Pending Photos Approval Queue</h3>
        <div class="photo-grid" id="queue-container"></div>

        <button class="btn-archive-toggle" id="archive-btn" onclick="toggleArchiveView()">📁 View History Archive</button>
        <div id="archive-section" style="display: none;">
            <h3 class="queue-title">All Uploaded Photos (Approved & Nuked)</h3>
            <div class="photo-grid" id="archive-container"></div>
        </div>
    </div>

    <script>
        // === PASTE YOUR SAME FIREBASE CONFIG OBJECT HERE ===
        const firebaseConfig = {
            apiKey: "AIzaSyACxw49eWeaIy-9Dieu0yaV28F7XdgG1hE",
  authDomain: "lunaphotowall.firebaseapp.com",
  projectId: "lunaphotowall",
  storageBucket: "lunaphotowall.firebasestorage.app",
  messagingSenderId: "890645449459",
  appId: "1:890645449459:web:040fceaec5c2a9f6f60586",
  measurementId: "G-53RH94EDMY"
        };
        // ===================================================

        firebase.initializeApp(firebaseConfig);
        const db = firebase.firestore();

        let archiveLoaded = false;

        initAdminPanel();

        function initAdminPanel() {
            db.collection('settings').doc('admin').onSnapshot((doc) => {
                if (doc.exists) {
                    const data = doc.data();
                    document.getElementById('mod-toggle').checked = data.moderationMode || false;
                    document.getElementById('leaderboard-toggle').checked = data.leaderboardActive || false;
                    document.getElementById('speed-select').value = data.slideshowSpeed || "5";
                    document.getElementById('theme-select').value = data.colorTheme || "black-red";
                    if (data.tickerText && document.activeElement !== document.getElementById('ticker-input')) {
                        document.getElementById('ticker-input').value = data.tickerText;
                    }
                }
            });

            // Pending photo queue viewer
            db.collection('photos')
              .where('status', '==', 'pending')
              .onSnapshot((snapshot) => {
                  const queueContainer = document.getElementById('queue-container');
                  queueContainer.innerHTML = '';
                  
                  if (snapshot.empty) {
                      queueContainer.innerHTML = '<p style="color:#aaa; grid-column: 1/-1; text-align:center;">No pending photos right now.</p>';
                      return;
                  }

                  let docsArray = [];
                  snapshot.forEach(doc => { docsArray.push({ id: doc.id, ...doc.data() }); });

                  docsArray.sort((a, b) => {
                      const timeA = a.timestamp ? a.timestamp.seconds : 0;
                      const timeB = b.timestamp ? b.timestamp.seconds : 0;
                      return timeA - timeB;
                  });

                  docsArray.forEach(item => {
                      const card = document.createElement('div');
                      card.className = 'photo-card';
                      card.innerHTML = `
                          <img src="${item.url}">
                          <div class="action-btns">
                              <button class="btn-action btn-approve" style="flex:1;" onclick="updateStatus('${item.id}', 'approved')">Approve</button>
                              <button class="btn-action btn-reject" style="flex:1;" onclick="updateStatus('${item.id}', 'rejected')">Delete</button>
                          </div>
                      `;
                      queueContainer.appendChild(card);
                  });
              });
        }

        function toggleArchiveView() {
            const archiveSection = document.getElementById('archive-section');
            const archiveBtn = document.getElementById('archive-btn');

            if (archiveSection.style.display === "none") {
                archiveSection.style.display = "block";
                archiveBtn.textContent = "📁 Close History Archive";
                
                if (!archiveLoaded) {
                    loadPhotoArchive();
                    archiveLoaded = true;
                }
            } else {
                archiveSection.style.display = "none";
                archiveBtn.textContent = "📁 View History Archive";
            }
        }

        function loadPhotoArchive() {
            db.collection('photos')
              .where('status', 'in', ['approved', 'archived'])
              .onSnapshot((snapshot) => {
                  const archiveContainer = document.getElementById('archive-container');
                  archiveContainer.innerHTML = '';

                  if (snapshot.empty) {
                      archiveContainer.innerHTML = '<p style="color:#aaa; grid-column: 1/-1; text-align:center;">The archive is currently empty.</p>';
                      return;
                  }

                  let docsArray = [];
                  snapshot.forEach(doc => { docsArray.push({ id: doc.id, ...doc.data() }); });

                  docsArray.sort((a, b) => {
                      const timeA = a.timestamp ? a.timestamp.seconds : 0;
                      const timeB = b.timestamp ? b.timestamp.seconds : 0;
                      return timeB - timeA;
                  });

                  docsArray.forEach(item => {
                      const card = document.createElement('div');
                      card.className = 'photo-card';
                      // FIXED: Added an incremental structural delete button next to download controls
                      card.innerHTML = `
                          <img src="${item.url}">
                          <div style="font-size: 11px; color: #888; margin-top: 5px;">Status: ${item.status.toUpperCase()} | ❤️ ${item.likes || 0}</div>
                          <div class="action-btns">
                              <button class="btn-action btn-download" onclick="downloadBase64('${item.url}', 'luna_${item.id}.jpg')">📥 Save</button>
                              <button class="btn-action btn-delete-permanent" onclick="deletePhotoPermanently('${item.id}')">❌ Delete</button>
                          </div>
                      `;
                      archiveContainer.appendChild(card);
                  });
              });
        }

        function downloadBase64(base64Data, filename) {
            const link = document.createElement('a');
            link.href = base64Data;
            link.download = filename;
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);
        }

        // NEW: Permanent database deletion logic block
        function deletePhotoPermanently(docId) {
            if (!confirm("Are you sure you want to PERMANENTLY delete this photo from the database? This cannot be undone and will remove it from the screen, archive, and user feed!")) return;
            
            db.collection('photos').doc(docId).delete()
              .then(() => {
                  alert("Photo completely removed from the cloud database! 🧹");
              })
              .catch(err => console.error("Permanent deletion failed: ", err));
        }

        function updateStatus(docId, newStatus) {
            db.collection('photos').doc(docId).update({ status: newStatus });
        }

        function toggleModeration(isTrue) {
            db.collection('settings').doc('admin').set({ moderationMode: isTrue }, { merge: true });
        }

        function toggleLeaderboard(isTrue) {
            db.collection('settings').doc('admin').set({ leaderboardActive: isTrue }, { merge: true });
        }

        function updateSpeed(seconds) {
            db.collection('settings').doc('admin').set({ slideshowSpeed: parseInt(seconds) }, { merge: true });
        }

        function updateTheme(themeName) {
            db.collection('settings').doc('admin').set({ colorTheme: themeName }, { merge: true });
        }

        function updateTicker() {
            const text = document.getElementById('ticker-input').value;
            db.collection('settings').doc('admin').set({ tickerText: text }, { merge: true });
            alert("Ticker text updated live on the TV screen! 📢");
        }

        async function nukeScreen() {
            if (!confirm("Are you sure you want to clear all active photos off the TV screen?")) return;
            try {
                const snapshot = await db.collection('photos').where('status', '==', 'approved').get();
                const batch = db.batch();
                snapshot.forEach(doc => { batch.update(doc.ref, { status: 'archived' }); });
                await batch.commit();
                alert("TV screen cleared successfully! 💥");
            } catch (error) { console.error("Nuke failed: ", error); }
        }
    </script>
</body>
</html>
